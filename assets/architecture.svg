<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 390" role="img" aria-labelledby="title desc">
<title id="title">Hermes orchestration architecture</title><desc id="desc">A supervisor routes short tasks to delegated children and durable work to the Kanban gateway, with a separate solver profile for difficult review.</desc>
