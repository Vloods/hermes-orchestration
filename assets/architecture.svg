<g fill="#171819"><rect x="44" y="118" width="230" height="152"/><rect x="420" y="94" width="255" height="73"/><rect x="420" y="219" width="255" height="73"/><rect x="826" y="94" width="218" height="73"/><rect x="826" y="219" width="218" height="73"/></g>
