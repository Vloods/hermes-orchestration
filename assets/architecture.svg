<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
<title id="title">Hermes Orchestration — three distinct lanes</title><desc id="desc">A supervisor sends short-lived work to delegates and gets results back. Durable work moves through Kanban and gateway to the named solver profile. Luna auxiliary services occupy a separate side lane.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#e76c37"/></marker></defs>
<rect width="1200" height="650" fill="#f2efe7"/>
<rect x="24" y="24" width="1152" height="602" fill="none" stroke="#b7b3a9"/>
<g font-family="Arial, Helvetica, sans-serif" fill="#182024"><text x="48" y="65" font-size="23" font-weight="700" letter-spacing="1.5">WORK HAS TWO CLOCKS</text><text x="48" y="89" font-size="13" letter-spacing="1.3">ONE SUPERVISOR  /  EXPLICIT ROUTING  /  VERIFIED RETURN</text></g>
<path d="M48 106H1152M48 487H1152M48 609H1152" stroke="#c6c0b5" fill="none"/>
<g font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="12" letter-spacing="1.5" fill="#a84525"><text x="48" y="138">01  SHORT-LIVED / FORK–JOIN</text><text x="48" y="318">02  DURABLE / NAMED ASSIGNEE</text><text x="48" y="517">03  AUXILIARY / SERVICE LANE</text></g>
<g fill="#172125"><rect x="48" y="159" width="285" height="122" rx="4"/><rect x="439" y="159" width="287" height="122" rx="4"/><rect x="836" y="159" width="316" height="122" rx="4"/>
<rect x="48" y="338" width="285" height="122" rx="4"/><rect x="439" y="338" width="287" height="122" rx="4"/><rect x="836" y="338" width="316" height="122" rx="4"/></g>
<g fill="#f2efe7" font-family="Arial, Helvetica, sans-serif"><text x="68" y="194" font-size="22" font-weight="700">SUPERVISOR</text><text x="68" y="219" font-size="14">Astra · low reasoning</text><text x="68" y="258" font-size="13">owns decision &amp; verification</text>
<text x="459" y="194" font-size="22" font-weight="700">DELEGATE</text><text x="459" y="219" font-size="14">Sol · medium · depth 1</text><text x="459" y="258" font-size="13">bounded task, up to 3 at once</text>
<text x="856" y="194" font-size="22" font-weight="700">RESULT</text><text x="856" y="219" font-size="14">short-lived return</text><text x="856" y="258" font-size="13">supervisor reviews outcome</text>
<text x="68" y="373" font-size="22" font-weight="700">KANBAN</text><text x="68" y="398" font-size="14">persistent task board</text><text x="68" y="437" font-size="13">explicit assignee: solver</text>
<text x="459" y="373" font-size="22" font-weight="700">GATEWAY</text><text x="459" y="398" font-size="14">dispatcher</text><text x="459" y="437" font-size="13">picks ready cards</text>
<text x="856" y="373" font-size="22" font-weight="700">SOLVER PROFILE</text><text x="856" y="398" font-size="14">Sol · high reasoning</text><text x="856" y="437" font-size="13">separate named worker</text></g>
<g stroke="#e76c37" stroke-width="3" fill="none" marker-end="url(#arrow)"><path d="M342 220H421"/><path d="M735 220H819"/><path d="M342 399H421"/><path d="M735 399H819"/></g>
