<text x="48" y="633" font-family="Arial, Helvetica, sans-serif" font-size="11" letter-spacing="1.2" fill="#5b6667">AUXILIARY IS NOT THE SUPERVISOR     /     KANBAN DOES NOT AUTO-ROUTE TO SOLVER</text>
