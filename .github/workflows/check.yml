name: Starter checks
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install renderer dependency
        run: python -m pip install -r requirements.txt
      - name: Unit and integration tests (offline)
        run: python -m unittest discover -s tests -v
      - name: Compile and validate XML
        run: python -m compileall -q scripts tests && python -c "import xml.etree.ElementTree as E; from pathlib import Path; [E.parse(p) for p in Path('assets').glob('*.svg')]"
